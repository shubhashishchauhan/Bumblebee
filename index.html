<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bumblebee</title>
</head>
<body>
  <h1>🐝 Bumblebee</h1>
  <p>Let's automate some letters.</p>

  <input type="file" id="docxInput" accept=".docx">
  <pre id="output" style="white-space:pre-wrap; background:#f4f4f4; padding:12px;"></pre>

  <h3>Detected placeholders:</h3>
  <ul id="placeholderList"></ul>

  <hr>

  <input type="file" id="xlsxInput" accept=".xlsx,.xls,.csv">
  <pre id="rowsOutput" style="white-space:pre-wrap; background:#eef; padding:12px;"></pre>

  <hr>

  <div>
    <button id="prevBtn">← Prev</button>
    <span id="rowLabel"></span>
    <button id="nextBtn">Next →</button>
    <button id="downloadBtn">Download this letter as PDF</button>
  </div>
  <pre id="mergedOutput" style="white-space:pre-wrap; background:#efe; padding:12px;"></pre>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    const docxInput = document.getElementById('docxInput');
    const output = document.getElementById('output');
    const placeholderList = document.getElementById('placeholderList');

    function extractPlaceholders(text) {
      const found = new Set();
      const regex = /\{\s*([^{}]+?)\s*\}/g;
      let match;
      while ((match = regex.exec(text))) {
        found.add(match[1].trim());
      }
      return [...found];
    }

    function mergeRow(templateText, rowData, placeholders) {
      let merged = templateText;
      placeholders.forEach(p => {
        const key = Object.keys(rowData).find(
          k => k.trim().toLowerCase() === p.toLowerCase()
        );
        const value = key !== undefined ? String(rowData[key]) : `[[MISSING: ${p}]]`;

        const escaped = p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const pattern = new RegExp('\\{\\s*' + escaped + '\\s*\\}', 'g');
        merged = merged.replace(pattern, value);
      });
      return merged;
    }

    docxInput.addEventListener('change', () => {
      const file = docxInput.files[0];
      const reader = new FileReader();

      reader.onload = (e) => {
        const arrayBuffer = e.target.result;
        mammoth.extractRawText({ arrayBuffer })
          .then(result => {
            output.textContent = result.value;

            const placeholders = extractPlaceholders(result.value);
            placeholderList.innerHTML = '';
            placeholders.forEach(p => {
              const li = document.createElement('li');
              li.textContent = p;
              placeholderList.appendChild(li);
            });

            if (rows.length > 0) showRow(currentRow);
          })
          .catch(err => {
            output.textContent = 'Error reading file: ' + err.message;
          });
      };

      reader.readAsArrayBuffer(file);
    });

    const xlsxInput = document.getElementById('xlsxInput');
    const rowsOutput = document.getElementById('rowsOutput');
    let rows = [];
    let currentRow = 0;

    xlsxInput.addEventListener('change', () => {
      const file = xlsxInput.files[0];
      const reader = new FileReader();

      reader.onload = (e) => {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];

        rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

        rowsOutput.textContent = rows.length + ' row(s) found.\n\n' + JSON.stringify(rows, null, 2);

        currentRow = 0;
        showRow(0);
      };

      reader.readAsArrayBuffer(file);
    });

    function showRow(i) {
      if (rows.length === 0) return;
      currentRow = Math.max(0, Math.min(rows.length - 1, i));

      document.getElementById('rowLabel').textContent =
        'Row ' + (currentRow + 1) + ' of ' + rows.length;

      const placeholders = extractPlaceholders(output.textContent);
      const merged = mergeRow(output.textContent, rows[currentRow], placeholders);
      document.getElementById('mergedOutput').textContent = merged;

      document.getElementById('prevBtn').disabled = currentRow === 0;
      document.getElementById('nextBtn').disabled = currentRow === rows.length - 1;
    }

    document.getElementById('prevBtn').addEventListener('click', () => showRow(currentRow - 1));
    document.getElementById('nextBtn').addEventListener('click', () => showRow(currentRow + 1));

    async function downloadCurrentAsPdf() {
      const el = document.getElementById('mergedOutput');

      const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff' });
      const imgData = canvas.toDataURL('image/png');

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4');

      const imgWidth = 210;
      const pageHeight = 297;
      const imgHeight = (canvas.height * imgWidth) / canvas.width;

      let heightLeft = imgHeight;
      let position = 0;

      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;

      while (heightLeft > 0) {
        position = heightLeft - imgHeight;
        pdf.addPage();
        pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
      }

      pdf.save('Row-' + (currentRow + 1) + '.pdf');
    }

    document.getElementById('downloadBtn').addEventListener('click', downloadCurrentAsPdf);
  </script>
</body>
</html>
