<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bumblebee</title>
</head>
<body>
  <h1>🐝 Bumblebee</h1>
  <p>Let's automate some letters.</p>

  <input type="file" id="docxInput" accept=".docx">

  <h3>Detected placeholders:</h3>
  <ul id="placeholderList"></ul>

  <hr>

  <input type="file" id="xlsxInput" accept=".xlsx,.xls,.csv">
  <pre id="rowsOutput" style="white-space:pre-wrap; background:#eef; padding:12px;"></pre>

  <hr>

  <h3>Option A — Exact formatting (recommended)</h3>
  <div>
    <button id="genOneDocxBtn">Download row 1 as .docx (exact)</button>
    <button id="genAllDocxBtn">Generate all &amp; download ZIP of .docx files</button>
  </div>

  <h3>Option B — PDF (best-effort, may drift slightly from the original)</h3>
  <div>
    <button id="genOnePdfBtn">Download row 1 as .pdf (best-effort)</button>
    <button id="genAllPdfBtn">Generate all &amp; download ZIP of PDFs (best-effort)</button>
  </div>

  <p id="genStatus"></p>

  <div id="pdfRenderTarget" style="position:fixed; left:-9999px; top:0; width:800px; background:#fff;"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.1.15/dist/docx-preview.js"></script>
  <script>
    const docxInput = document.getElementById('docxInput');
    const placeholderList = document.getElementById('placeholderList');

    let templateArrayBuffer = null;
    let placeholders = [];

    const XML_PARTS = [
      'word/document.xml',
      'word/header1.xml', 'word/header2.xml', 'word/header3.xml',
      'word/footer1.xml', 'word/footer2.xml', 'word/footer3.xml'
    ];

    function extractVisibleText(xmlString) {
      const doc = new DOMParser().parseFromString(xmlString, 'application/xml');
      const nodes = doc.getElementsByTagName('w:t');
      let text = '';
      for (let i = 0; i < nodes.length; i++) text += nodes[i].textContent;
      return text;
    }

    function findPlaceholders(text) {
      const found = new Set();
      const regex = /\{\s*([^{}]+?)\s*\}/g;
      let match;
      while ((match = regex.exec(text))) {
        found.add(match[1].trim());
      }
      return [...found];
    }

    function escapeXml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function escapeRegex(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    docxInput.addEventListener('change', () => {
      const file = docxInput.files[0];
      const reader = new FileReader();

      reader.onload = async (e) => {
        templateArrayBuffer = e.target.result;

        const zip = await JSZip.loadAsync(templateArrayBuffer);
        let allText = '';
        for (const part of XML_PARTS) {
          const entry = zip.file(part);
          if (entry) {
            const xml = await entry.async('string');
            allText += extractVisibleText(xml) + '\n';
          }
        }

        placeholders = findPlaceholders(allText);
        placeholderList.innerHTML = '';
        placeholders.forEach(p => {
          const li = document.createElement('li');
          li.textContent = p;
          placeholderList.appendChild(li);
        });

        if (placeholders.length === 0) {
          placeholderList.innerHTML = '<li style="color:red;">No {placeholders} found — check your template.</li>';
        }
      };

      reader.readAsArrayBuffer(file);
    });

    const xlsxInput = document.getElementById('xlsxInput');
    const rowsOutput = document.getElementById('rowsOutput');
    let rows = [];

    xlsxInput.addEventListener('change', () => {
      const file = xlsxInput.files[0];
      const reader = new FileReader();

      reader.onload = (e) => {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];

        rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
        rowsOutput.textContent = rows.length + ' row(s) found.\n\n' + JSON.stringify(rows, null, 2);
      };

      reader.readAsArrayBuffer(file);
    });

    async function buildMergedDocxBlob(rowData) {
      const zip = await JSZip.loadAsync(templateArrayBuffer);

      for (const part of XML_PARTS) {
        const entry = zip.file(part);
        if (!entry) continue;

        let xml = await entry.async('string');

        placeholders.forEach(p => {
          const key = Object.keys(rowData).find(
            k => k.trim().toLowerCase() === p.toLowerCase()
          );
          const value = key !== undefined ? escapeXml(String(rowData[key])) : '{' + p + '}';
          const pattern = new RegExp('\\{\\s*' + escapeRegex(p) + '\\s*\\}', 'g');
          xml = xml.replace(pattern, value);
        });

        zip.file(part, xml);
      }

      return await zip.generateAsync({
        type: 'blob',
        mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
      });
    }

    function checkReady() {
      if (!templateArrayBuffer || rows.length === 0) {
